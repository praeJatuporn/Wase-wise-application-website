<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <!--Goolge font-->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Encode+Sans:wght@100..900&family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap"
            rel="stylesheet"
        />

        <!-- CSS Linking -->
        <link rel="stylesheet" href="css/reset.css" />
        <link rel="stylesheet" href="css/base.css" />
        <link rel="stylesheet" href="css/layout.css" />
        <link rel="stylesheet" href="css/components.css" />
        <link rel="stylesheet" href="css/page_css/log_in.css" />

        <!-- Favicon -->
        <link rel="icon" type="image/x-icon" href="images/favicon.ico" />

        <title>Waste Wise</title>
    </head>

    <body>
        <!--Set up Page mobile & Desktop-->
        <nav id="nav-mobile" aria-label="Main Navigation">
            <ul>
                <li>
                    <a href="./index.html" aria-current="page"
                        ><span class="icon">🏡</span></a
                    >
                </li>
                <li>
                    <a href="exchange_product.html"
                        ><span class="icon">🔃</span></a
                    >
                </li>
                <li>
                    <a href="events.html"><span class="icon">🗓️</span></a>
                </li>
                <li>
                    <a href="recipe.html"><span class="icon">📋</span></a>
                </li>
                <li>
                    <a href="setting.html"><span class="icon">⚙️</span></a>
                </li>
            </ul>
        </nav>

        <nav id="nav-desktop" aria-label="Main Navigation">
            <ul>
                <li>
                    <a href="./index.html" aria-current="page">Home</a>
                </li>
                <li><a href="exchange_product.html">Exchange Products</a></li>
                <li><a href="events.html">Events</a></li>
                <li><a href="recipe.html">Recipe</a></li>
                <li><a href="setting.html">Setting</a></li>
            </ul>
        </nav>
        <!--END Set up Page mobile & Desktop-->

        <main>
            <div class="container">
                <section class="form-container">
                    <h1 style="text-align: center">Log In</h1>

                    <form class="user-info-form" id="login-form" novalidate>
                        <!-- Email -->
                        <label for="login-email" class="form-label">Email</label>
                        <input
                            type="email"
                            id="login-email"
                            name="login-email"
                            class="form-input"
                            required
                            aria-describedby="login-email-error"
                            aria-invalid="false"
                        />
                        <small
                            class="error"
                            id="login-email-error"
                            role="alert"
                        ></small>

                        <!-- Password -->
                        <label for="login-password" class="form-label"
                            >Password</label
                        >
                        <input
                            type="password"
                            id="login-password"
                            name="login-password"
                            class="form-input"
                            required
                            aria-describedby="login-password-error"
                            aria-invalid="false"
                        />
                        <small
                            class="error"
                            id="login-password-error"
                            role="alert"
                        ></small>

                        <button type="submit" class="form-button">Log In</button>
                    </form>
                </section>
            </div>
        </main>
        <!-- Footer -->
        <footer class="footer">
            <div class="wrapper">
                <div class="footer-row">
                    <ul class="footer-links">
                        <li><a href="about.html">About Us</a></li>
                        <li><a href="contact.html">Contact Us</a></li>
                        <li><a href="policy.html">Policy and Privacy</a></li>
                    </ul>
                    <div class="footer-brand">
                        <img
                            src="images/logo.png"
                            alt="Site logo"
                            class="footer-logo"
                        />
                        <span>Waste Wise</span>
                    </div>
                </div>
            </div>
        </footer>
        <!-- JavaScript -->
        <script type="module" src="js/page_js/log_in.js"></script>
    </body>
</html>
